name: ci
# Runs on the ci-gate branch, on pull requests and by hand only: the account's free Actions minutes are shared by
# every private repository (owner, 2026-10-17). Push a batch of work to ci-gate, then move main to it on success.
on:
  push:
    branches: [ci-gate]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src
